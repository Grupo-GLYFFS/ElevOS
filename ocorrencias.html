<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fila de ocorrencias — ElevOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/elevos.css" rel="stylesheet">
</head>
<body>

<div id="navbar"></div>

<main class="container-xl py-4">

  <!-- cabecalho -->
  <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
    <div>
      <p class="rotulo-secao mb-1">Central de operacao</p>
      <h1 class="h3 mb-1">Fila priorizada</h1>
      <p class="texto-fraco small mb-0">
        Ordenada por prioridade e, dentro dela, por tempo de espera. O SLA corre em tempo real.
      </p>
    </div>
    <div class="d-flex gap-2" id="resumo"></div>
  </div>

  <!-- filtros -->
  <div class="painel p-3 mb-4">
    <div class="row g-2 align-items-end">
      <div class="col-6 col-lg-3">
        <label class="rotulo-secao d-block mb-1" for="fStatus">Status</label>
        <select class="form-select form-select-sm" id="fStatus">
          <option value="abertas" selected>Em aberto</option>
          <option value="todas">Todas</option>
          <option value="aberta">Aberta</option>
          <option value="despachada">Despachada</option>
          <option value="em_atendimento">Em atendimento</option>
          <option value="resolvida">Resolvida</option>
        </select>
      </div>
      <div class="col-6 col-lg-3">
        <label class="rotulo-secao d-block mb-1" for="fPrioridade">Prioridade</label>
        <select class="form-select form-select-sm" id="fPrioridade">
          <option value="">Todas</option>
          <option value="P1">P1 Critico</option>
          <option value="P2">P2 Alto</option>
          <option value="P3">P3 Medio</option>
          <option value="P4">P4 Baixo</option>
        </select>
      </div>
      <div class="col-12 col-lg-4">
        <label class="rotulo-secao d-block mb-1" for="fPredio">Predio</label>
        <select class="form-select form-select-sm" id="fPredio"><option value="">Todos</option></select>
      </div>
      <div class="col-12 col-lg-2 d-grid">
        <button class="btn btn-suave btn-sm" id="btnLimpar" type="button">Limpar filtros</button>
      </div>
    </div>
  </div>

  <!-- lista -->
  <div id="lista" class="d-flex flex-column gap-3"></div>
  <p class="texto-fraco small mt-3 mb-0" id="rodapeContagem"></p>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/regras.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
Store.init();
renderizarCasca("ocorrencias");

const filtros = { status: "abertas", prioridade: "", predio: "" };

/* ---------- opcoes de predio ---------- */
Store.predios().forEach((p) => {
  const opt = document.createElement("option");
  opt.value = p;
  opt.textContent = p;
  $("#fPredio").appendChild(opt);
});

/* ---------- filtros vindos por query param (links do dashboard) ---------- */
if (param("predio")) {
  filtros.predio = param("predio");
  filtros.status = "todas";
  $("#fPredio").value = filtros.predio;
  $("#fStatus").value = "todas";
}
if (param("prioridade")) {
  filtros.prioridade = param("prioridade");
  $("#fPrioridade").value = filtros.prioridade;
}

/* ---------- selecao filtrada ---------- */
function selecionar() {
  const elevPorId = {};
  Store.elevadores().forEach((e) => (elevPorId[e.id] = e));

  const filtradas = Store.ocorrencias().filter((o) => {
    const elev = elevPorId[o.elevadorId];
    if (filtros.status === "abertas" ? o.status === "resolvida" : filtros.status !== "todas" && o.status !== filtros.status) return false;
    if (filtros.prioridade && o.prioridade !== filtros.prioridade) return false;
    if (filtros.predio && elev.predio !== filtros.predio) return false;
    return true;
  });

  // resolvidas nao tem urgencia: listadas da mais recente para a mais antiga
  if (filtros.status === "resolvida") {
    return filtradas.sort((a, b) => new Date(b.resolvidoEm || b.criadoEm) - new Date(a.resolvidoEm || a.criadoEm));
  }
  return ordenarFila(filtradas);
}

/* ---------- card ---------- */
function cardOcorrencia(o) {
  const elev = Store.elevador(o.elevadorId);
  const tec = o.tecnicoId ? Store.tecnico(o.tecnicoId) : null;
  const classe = (PRIORIDADES[o.prioridade] || PRIORIDADES.P4).classe;
  const sla = estadoSla(o);

  const presas = o.pessoasPresas > 0
    ? `<span class="pill-info" style="color:#FCA5A5;border-color:rgba(239,68,68,.4)">${o.pessoasPresas} pessoa(s) presa(s)</span>`
    : "";

  const acao = o.status === "resolvida"
    ? `<a class="btn btn-suave btn-sm" href="ocorrencia.html?id=${o.id}">Ver detalhe</a>`
    : o.status === "aberta"
      ? `<a class="btn btn-primary btn-sm" href="ocorrencia.html?id=${o.id}">Despachar</a>`
      : `<a class="btn btn-outline-primary btn-sm" href="ocorrencia.html?id=${o.id}">Acompanhar</a>`;

  return `<article class="card card-clicavel faixa-prio ${classe}">
    <div class="card-body p-3 p-md-4">
      <div class="row g-3 align-items-start">
        <div class="col-12 col-lg-8">
          <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
            ${badgePrioridade(o.prioridade)}
            <span class="codigo-elevador fw-bold">${esc(elev.codigo)}</span>
            ${badgeStatus(o.status)}
            <span class="sla ${sla.classe}" data-sla="${o.id}">${sla.texto}</span>
          </div>
          <h2 class="h6 mb-1">${esc(rotuloTipo(o.tipo))} &middot; ${esc(elev.predio)}</h2>
          <p class="small texto-fraco mb-2">
            #${o.id} &middot; aberta ${tempoRelativo(o.criadoEm)} (${fmtDataHora(o.criadoEm)}) &middot; via ${esc(rotuloOrigem(o.origem))}
            ${tec ? ` &middot; tecnico ${esc(tec.nome)}` : ""}
          </p>
          <p class="small mb-2">${esc(o.descricao) || '<span class="texto-fraco">Sem descricao informada.</span>'}</p>
          <div class="d-flex flex-wrap gap-2">
            ${presas}
            <span class="pill-info">SLA ${formatarDuracao(o.slaMinutos)}</span>
            <span class="pill-info">${esc(elev.predio)} &middot; ${elev.andares} andares</span>
          </div>
        </div>
        <div class="col-12 col-lg-4 d-flex flex-lg-column align-items-lg-end gap-2">
          ${acao}
        </div>
      </div>
    </div>
  </article>`;
}

/* ---------- render ---------- */
function render() {
  const lista = selecionar();
  $("#lista").innerHTML = lista.length
    ? lista.map(cardOcorrencia).join("")
    : `<div class="painel p-5 text-center texto-fraco">Nenhuma ocorrencia com esses filtros.</div>`;
  $("#rodapeContagem").textContent = `${lista.length} ocorrencia(s) listada(s) de ${Store.ocorrencias().length} no total.`;
  renderResumo();
}

function renderResumo() {
  const abertas = Store.ocorrencias().filter(emAberto);
  const p1 = abertas.filter((o) => o.prioridade === "P1").length;
  const estouradas = abertas.filter((o) => !estadoSla(o).cumprido).length;

  $("#resumo").innerHTML = `
    <div class="painel px-3 py-2 text-center">
      <div class="kpi-valor" style="font-size:1.5rem">${abertas.length}</div>
      <div class="rotulo-secao">Em aberto</div>
    </div>
    <div class="painel px-3 py-2 text-center">
      <div class="kpi-valor" style="font-size:1.5rem;color:${p1 ? "var(--elevos-vermelho)" : "inherit"}">${p1}</div>
      <div class="rotulo-secao">P1 ativos</div>
    </div>
    <div class="painel px-3 py-2 text-center">
      <div class="kpi-valor" style="font-size:1.5rem;color:${estouradas ? "var(--elevos-amarelo)" : "inherit"}">${estouradas}</div>
      <div class="rotulo-secao">SLA estourado</div>
    </div>`;
}

/* ---------- cronometro: atualiza so os campos de SLA ---------- */
setInterval(() => {
  $$("[data-sla]").forEach((el) => {
    const o = Store.ocorrencia(el.dataset.sla);
    if (!o) return;
    const sla = estadoSla(o);
    el.textContent = sla.texto;
    el.className = `sla ${sla.classe}`;
  });
  renderResumo();
}, 1000);

/* ---------- eventos ---------- */
$("#fStatus").addEventListener("change", (e) => { filtros.status = e.target.value; render(); });
$("#fPrioridade").addEventListener("change", (e) => { filtros.prioridade = e.target.value; render(); });
$("#fPredio").addEventListener("change", (e) => { filtros.predio = e.target.value; render(); });
$("#btnLimpar").addEventListener("click", () => {
  filtros.status = "abertas"; filtros.prioridade = ""; filtros.predio = "";
  $("#fStatus").value = "abertas"; $("#fPrioridade").value = ""; $("#fPredio").value = "";
  render();
});

render();
</script>
</body>
</html>
